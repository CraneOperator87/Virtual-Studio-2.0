<style>
     /* Her lager vi CSS i HTML, siden det er litt mer oversiktelig :) */
        .grid-container {
            display: grid;  /* Først, er det greit å ha en grid */
            grid-template-columns: repeat(3, 1fr);
            padding: 20px;
            border: 1px solid white;
        }
        .grid-item {
            display: flex;  /* flexbox : Enklere å plasere bilder (Inne i gridcontainer) */       
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px;
        }
        .grid-item img {
            width: 300px;
            height: auto;
            margin-bottom: 10px;
        }
</style>
</head>
