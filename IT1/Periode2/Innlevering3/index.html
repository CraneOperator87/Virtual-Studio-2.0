<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Høyeste Skyskrapere</title>
    <link rel="stylesheet" type = "text/css" href="styles/styles.css">
</head>

<body>
    <div class = "gridcontainer">
        <div class = "header">
            <h1>Verdens tre høyeste skyskrapere</h1>
        </div>
        <div class = "main">
            <section>
                <table>
                    <tr>
                        <th>Skyskraper</th>
                        <th>Høyde</th>
                        <th>By</th>
                        <th>Land</th>
                        <th>Byggeår</th>
                    </tr>
                    <tr>
                        <td>Burj Khalifa</td>
                        <td>828 m</td>
                        <td>Dubai</td>
                        <td>De forente arabiske-emirater</td>
                        <td>2009</td>
                    </tr>
                    <tr>
                        <td>Shanghai Tower</td>
                        <td>632 m</td>
                        <td>Shanghai</td>
                        <td>Kina</td>
                        <td>2014</td>
                    </tr>
                    <tr>
                        <td>Makkah Royal Clock Tower</td>
                        <td>601 m</td>
                        <td>Mekka</td>
                        <td>Saudi-Arabia</td>
                        <td>2011</td>
                    </tr>
                  </table>
            </section>
        </div>
        
           
            <div class = "grid-photo photo1">
                <img src = "images/burj_khalifa.jpg" alt = "Burj Khalifa">
            </div>
            
            <div class = "grid-photo photo2">
                <img src = "images/Shanghai.jpg" alt = "Shanghai Tower">
            </div>

            <div class = "grid-photo photo3">
                <img src="images/Makkah.jpg" alt = "Makkah Royal Clock Tower">
            </div>
    </div>    
</body>
</html>
