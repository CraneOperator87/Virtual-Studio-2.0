<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visittkort Generator</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <main>
        <div class="hoved">
            <h1>Registrer elev</h1>
            <div id="visittkort-skjema">
                <div class="griditem">
                    <label for="navn">Navn</label>
                    <input type="text" id="navn" placeholder="Ola Nordmann">
                </div>
                
                <div class="griditem">
                    <label for="telefon">Telefonnummer</label>
                    <input type="number" id="telefon" placeholder="12345678">
                </div>

                <div class="griditem">
                    <label for="beskrivelse">Kort tekst om personen</label>
                    <textarea id="beskrivelse" placeholder="Skriv en kort tekst om personen"></textarea>
                </div>
                
                <div class="griditem">
                    <label for="trinn">Trinn</label>
                    <select id="trinn">
                        <option value="vg1">Vg1</option>
                        <option value="vg2">Vg2</option>
                        <option value="vg3">Vg3</option>
                    </select>
                </div>
            </div>
            <button type="button" onclick="genererVisittkort()">Generer visittkort</button>
        </div>
        <div id="visittkort"></div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
