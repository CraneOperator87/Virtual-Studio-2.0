<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App from API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Quiz App</h1>
    <h2 id="category"></h2>
    <section id="quiz"></section>  <!-- Quzi spørsmål vil bli lagt til her -->
    <section id="result" class="result"></section>
    <section id=""actions">
        <button id="submit" class="button">Send svar</button>  <!-- Sjekker og registrerer antall riktig svar-->
        <button id="retry" class="button hide">Prøv på nytt</button>  <!-- Starter den samme quiz på nytt-->
        <button id="new" class="button hide">Hente ny quiz</button> <!-- Henter en nytt Quiz fra Quiz API-->
    </section> 
</div>
  <script src="script.js"></script>   
</body>
</html>
