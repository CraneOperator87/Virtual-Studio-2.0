<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-spill</title>
    <link rel="stylesheet" type="text/css" href="../styles/styles.css"/>
</head>
<body>
    <header>
        <h1>VELKOMMEN TIL 50-SPILLET</h1>
        <button id="spillStart">Start Spillet</button>
    </header>
    <main>
        <div id="spillInnhold" style="display: none;">
            <p>Spillet har startet!</p>
            <article>
                <div id="runde">Runde: 0</div>
                <button id="restart">Restart</button>
                <div class="game" id="gameBoard">
                    <div class="player">
                        <div id="spiller1">Spiller 1: 0</div>
                        <img src="../images/dice.png" id="dice" alt="Terning som ikke har blitt kastet">
                        <button id="kastTerning">Kast Terning</button>
                        <p id="terningResultat1">0</p>
                    </div>
                    <div class="player">
                        <div id="spiller2">Spiller 2: 0</div>
                        <img src="../images/dice.png" id="dice2" alt="Terning som ikke har blitt kastet">
                        <button id="kastTerning">Kast Terning</button>
                        <p id="terningResultat2">0</p>
                    </div>
                </div>
                <div class="poengSum">
                    <div id="poengSum1">Poengsum Spiller 1: 0</div>
                    <div id="poengSum2">Poengsum Spiller 2: 0</div>
                </div>
            </article>
        </div>
    </main>
    <script src="../js/script.js"></script>
</body>
</html>
